<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Telegram Mini App - localStorage</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; }
    pre { background:#f6f6f6; padding:12px; border-radius:8px; overflow:auto; }
    button { padding: 10px 14px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <h3>Telegram Mini App (без бэка)</h3>

  <div id="status">Проверка...</div>
  <div id="user"></div>

  <h4>initData (как есть)</h4>
  <pre id="raw"></pre>

  <button id="clear">Очистить localStorage</button>

  <script>
    const LS_KEY = "tg_initData";

    function getTelegramInitData() {
      return window.Telegram?.WebApp?.initData || "";
    }

    function parseInitData(initData) {
      // initData: query_id=...&user=%7B...%7D&auth_date=...&hash=...
      const params = new URLSearchParams(initData);
      const userStr = params.get("user");
      let user = null;

      try {
        user = userStr ? JSON.parse(userStr) : null;
      } catch {
        user = null;
      }

      return {
        query_id: params.get("query_id"),
        user,
        auth_date: params.get("auth_date"),
        hash: params.get("hash"),
      };
    }

    async function init() {
      const tg = window.Telegram?.WebApp;
      if (tg?.ready) tg.ready();
      if (tg?.expand) tg.expand();

      const stored = localStorage.getItem(LS_KEY);

      // Если открылись второй раз — можно показать из localStorage
      if (stored) {
        const parsed = parseInitData(stored);
        document.getElementById("user").innerHTML = renderUser(parsed.user);
        document.getElementById("raw").textContent = stored;
        document.getElementById("status").textContent =
          "Загружено из localStorage (без крипто-проверки).";
      }

      const initData = getTelegramInitData();
      if (!initData) {
        document.getElementById("status").textContent =
          "initData не найден. Открыто не как Mini App или Telegram не передал данные.";
        return;
      }

      // Обновим localStorage свежими данными
      localStorage.setItem(LS_KEY, initData);

      const parsed = parseInitData(initData);
      document.getElementById("user").innerHTML = renderUser(parsed.user);
      document.getElementById("raw").textContent = initData;
      document.getElementById("status").textContent =
        "initData получен из Telegram. Хэш НЕ проверен (без бэка).";
    }

    function renderUser(user) {
      if (!user) return "<div>Пользователь: (не удалось распарсить)</div>";
      const name = `${user.first_name || ""} ${user.last_name || ""}`.trim();
      return `
        <div><b>ID:</b> ${user.id}</div>
        <div><b>Имя:</b> ${name || "-"}</div>
        <div><b>Username:</b> @${user.username || "-"}</div>
      `;
    }

    document.getElementById("clear").addEventListener("click", () => {
      localStorage.removeItem(LS_KEY);
      document.getElementById("user").innerHTML = "";
      document.getElementById("raw").textContent = "";
      document.getElementById("status").textContent = "localStorage очищен.";
    });

    init();
  </script>
</body>
</html>
