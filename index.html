  <!-- Content Security Policy: защита от XSS и инъекций -->
  <!-- Разрешаем только необходимые домены для минимизации утечки информации злоумышленникам -->
  <!-- unsafe-inline для script-src необходим для Vite HMR в dev режиме -->
  <!-- *.bravavless.ru разрешает все поддомены (api.bravavless.ru, miniapp.bravavless.ru и т.д.) -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://telegram.org;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    img-src 'self' data: https:;
    font-src 'self' data: https://fonts.gstatic.com;
    connect-src 'self' https://*.bravavless.ru https://bravavless.ru https://api.bot.bravavless.ru https://*.devtunnels.ms wss://localhost:* ws://localhost:* https://localhost:* http://localhost:*;
    frame-ancestors 'none';
    base-uri 'self';
    form-action 'self';
    upgrade-insecure-requests;
  " />
  
  <!-- X-Frame-Options: защита от clickjacking -->
  <meta http-equiv="X-Frame-Options" content="DENY" />
  
  <!-- X-Content-Type-Options: предотвращение MIME-sniffing -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  
  <!-- Referrer Policy: минимизация утечки информации о домене -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  
  <!-- Google Fonts: Exo 2 для лого и Orbitron для заголовков -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <title>Brava VLESS</title>
  <!-- Telegram WebApp SDK для haptic feedback и других функций -->
  <!-- SRI: Subresource Integrity для защиты от компрометации CDN -->
  <!-- Примечание: Telegram может обновлять скрипт, поэтому SRI может потребовать обновления -->
  <script 
    src="https://telegram.org/js/telegram-web-app.js" 
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
